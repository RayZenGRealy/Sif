<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIF" />
    <link rel="manifest" href="/manifest.json" />
    
    <title>SIF System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sif: {
                bg: '#0f172a',
                panel: '#1e293b',
                joy: '#fbbf24', // Amber
                sadness: '#3b82f6', // Blue
                anger: '#ef4444', // Red
                fear: '#a855f7', // Purple
                curiosity: '#22c55e', // Green
                affection: '#ec4899', // Pink
                pride: '#f97316', // Orange
                shame: '#64748b', // Slate
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 3s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              glow: {
                'from': { boxShadow: '0 0 10px currentColor' },
                'to': { boxShadow: '0 0 20px currentColor, 0 0 10px currentColor' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
        -webkit-tap-highlight-color: transparent; /* Remove blue highlight on tap */
        touch-action: manipulation;
      }
      /* Prevent text selection to feel more like an app */
      * {
        -webkit-user-select: none;
        user-select: none;
      }
      /* Re-enable text selection for inputs and chat messages */
      input, textarea, [contenteditable=true], .whitespace-pre-wrap {
        -webkit-user-select: text;
        user-select: text;
      }
      
      /* Custom scrollbar for panels */
      ::-webkit-scrollbar {
        width: 4px; /* Thinner scrollbar for mobile */
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW registration failed', err));
        });
      }
    </script>
  </body>
</html>
