<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SIF" />
    <link rel="manifest" href="./manifest.json" />
    
    <title>SIF System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Polyfill for process.env
      if (typeof process === 'undefined') {
        window.process = { env: { API_KEY: '' } };
      }
      
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sif: {
                bg: '#0f172a',
                panel: '#1e293b',
                joy: '#fbbf24',
                sadness: '#3b82f6',
                anger: '#ef4444',
                fear: '#a855f7',
                curiosity: '#22c55e',
                affection: '#ec4899',
                pride: '#f97316',
                shame: '#64748b',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      * { -webkit-user-select: none; user-select: none; }
      input, textarea, .selectable { -webkit-user-select: text; user-select: text; }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
      .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script>
      // Robust SW registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = './service-worker.js';
          // Check if origin matches to avoid the scriptURL origin error
          try {
            const swAbsoluteUrl = new URL(swUrl, window.location.href).href;
            if (new URL(swAbsoluteUrl).origin === window.location.origin) {
              navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('SW registered'))
                .catch(err => console.warn('SW registration failed (non-critical):', err));
            } else {
              console.warn('SW skipped: Origin mismatch in preview environment.');
            }
          } catch (e) {
            console.error('SW init error:', e);
          }
        });
      }
    </script>
  </body>
</html>
